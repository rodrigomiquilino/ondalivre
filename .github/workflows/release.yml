# Build Windows MSVC exe; SignPath when SIGNPATH_API_TOKEN is set; else publish unsigned.
# Secrets: SIGNPATH_API_TOKEN (optional)
# Vars:    ORGANIZATION_ID, PROJECT_SLUG, SIGNING_POLICY_SLUG (needed only when signing)
# Optional var: ARTIFACT_CONFIGURATION_SLUG (defaults to "default")
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release exe
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage unsigned artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item -Force `
            target\x86_64-pc-windows-msvc\release\ondalivre.exe `
            unsigned\ondalivre.exe

      - name: Upload unsigned artifact
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: ondalivre-windows-unsigned
          path: unsigned/ondalivre.exe
          if-no-files-found: error

      - name: Resolve version for SignPath metadata
        id: ver
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SignPath version param=$tag"

      - name: Submit SignPath signing request
        id: sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.ORGANIZATION_ID }}
          project-slug: ${{ vars.PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.ARTIFACT_CONFIGURATION_SLUG || 'default' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Stage publish folder (signed or unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          if ($env:SIGNPATH_API_TOKEN -and (Test-Path "signed/ondalivre.exe")) {
            Copy-Item -Force signed/ondalivre.exe publish/ondalivre.exe
            Write-Host "Publishing SIGNED build"
          } else {
            Copy-Item -Force unsigned/ondalivre.exe publish/ondalivre.exe
            Write-Host "Publishing UNSIGNED MSVC build (SIGNPATH_API_TOKEN not set)"
          }
          $exe = "publish/ondalivre.exe"
          if (-not (Test-Path $exe)) { throw "publish exe missing" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          Set-Content -Path "publish/ondalivre.exe.sha256" -Value "$hash  ondalivre.exe" -NoNewline
          Write-Host "SHA256=$hash"
          Get-Item $exe | Format-List Name, Length

      - name: Publish exe + sha256 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ondalivre.exe
            publish/ondalivre.exe.sha256
          name: OndaLivre ${{ github.ref_name }}
          body: |
            ## OndaLivre ${{ github.ref_name }}

            Primeiro lançamento público da automação de rádio portátil em Rust (interface Fluent).

            ### O que entrou (fases A–C)
            - **Fase A:** motor de áudio, playlist (`.lst`/`.m3u`/`.pls`/`.rot`/`.seq`), eventos, jingles/sweepers, fade, log, satélite/AGC/DTMF, exportações.
            - **Fase B:** endurecimento (pause não bloqueante, Goertzel estável, backpressure do satélite, toast de senha).
            - **Fase C:** UI Fluent (nav, biblioteca real, sem Dispositivos), carts F1–F12 com `consume_key`, toggle/Esc para parar jingles, Anunciar hora (Time/ + SAPI pt-BR), atualização automática via GitHub Releases (ETag/6h, InfoBar, sha256, troca por rename sem interromper o ar).

            ### Download
            - `ondalivre.exe` — build MSVC x64 (portátil; config ao lado do exe)
            - `ondalivre.exe.sha256` — checksum SHA-256

            ### Assinatura
            **Ainda sem assinatura digital.** O SmartScreen / Windows Defender SmartScreen pode avisar na primeira execução — isso é esperado neste lançamento. A assinatura Authenticode (SignPath) será ligada quando o segredo `SIGNPATH_API_TOKEN` estiver configurado.

            ### Verificação
            ```
            certutil -hashfile ondalivre.exe SHA256
            ```
            Compare com o conteúdo de `ondalivre.exe.sha256`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
